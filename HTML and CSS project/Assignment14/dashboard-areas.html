<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    .layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-areas:
        "header header"
        "sidebar main"
        "footer footer";
      gap: 8px;
      min-height: 300px;
    }
    .header  { grid-area: header;  background-color: #ffafcc; padding: 14px; }
    .sidebar { grid-area: sidebar; background-color: #bde0fe; padding: 14px; }
    .main    { grid-area: main;    background-color: #caffbf; padding: 14px; }
    .footer  { grid-area: footer;  background-color: #ffd6a5; padding: 14px; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="header">Header</div>
    <div class="sidebar">Sidebar</div>
    <div class="main">Main area</div>
    <div class="footer">Footer</div>
  </div>
</body>
</html>
