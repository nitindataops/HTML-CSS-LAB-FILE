<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Variables</title>
  <style>
    :root {
      --main-color: #1d3557;
      --accent-color: #e63946;
      --page-padding: 20px;
    }
    body {
      color: var(--main-color);
      padding: var(--page-padding);
    }
    h1 {
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <h1>CSS Variables</h1>
  <p>The text uses the main colour and the heading uses the accent colour.</p>
</body>
</html>
