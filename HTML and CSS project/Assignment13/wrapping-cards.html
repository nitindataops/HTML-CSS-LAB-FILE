<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wrapping Cards</title>
  <style>
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card {
      width: 130px;
      padding: 10px;
      text-align: center;
      border: 1px solid gray;
      border-radius: 8px;
      background-color: #fff7e6;
    }
  </style>
</head>
<body>
  <h1>Stationery Shop</h1>
  <div class="row">
    <div class="card"><h3>Notebook</h3><p>Price 60</p></div>
    <div class="card"><h3>Pen</h3><p>Price 15</p></div>
    <div class="card"><h3>Bag</h3><p>Price 350</p></div>
    <div class="card"><h3>Book</h3><p>Price 120</p></div>
  </div>
</body>
</html>
